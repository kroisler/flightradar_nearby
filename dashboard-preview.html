<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flightradar Nearby – Dashboard Preview</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --border: #2a2a4a;
            --text: #eaeaea;
            --muted: #8b949e;
            --accent: #58a6ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1.5rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }

        .header h1 { font-size: 1.1rem; }
        .header .stats { display: flex; gap: 1.5rem; font-size: 0.85rem; color: var(--muted); }
        .header .stats span { display: flex; align-items: center; gap: 0.3rem; }

        .main {
            display: grid;
            grid-template-columns: 1fr 380px;
            flex: 1;
            overflow: hidden;
        }

        #map { width: 100%; height: 100%; }

        .sidebar {
            background: var(--card);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            padding: 1rem;
        }

        .sidebar h2 { font-size: 0.9rem; color: var(--muted); margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }

        .flight-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.8rem;
            margin-bottom: 0.6rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .flight-card:hover, .flight-card.active { border-color: var(--accent); }

        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
        }

        .flight-number { font-weight: 700; font-size: 1rem; color: var(--accent); }
        .flight-distance { font-size: 0.8rem; color: var(--muted); }

        .flight-airline { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }

        .flight-route {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }

        .airport {
            text-align: center;
            flex: 1;
        }

        .airport-iata { font-weight: 700; font-size: 0.95rem; }
        .airport-name { font-size: 0.7rem; color: var(--muted); }
        .airport-time { font-size: 0.75rem; color: var(--accent); margin-top: 0.2rem; }

        .route-arrow {
            color: var(--muted);
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .flight-meta {
            display: flex;
            gap: 0.8rem;
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.4rem;
            padding-top: 0.4rem;
            border-top: 1px solid var(--border);
        }

        .flight-meta span { display: flex; align-items: center; gap: 0.2rem; }

        /* Leaflet Overrides */
        .leaflet-container { background: #0d1117; }
        .leaflet-tile { filter: brightness(0.7) saturate(0.8) hue-rotate(180deg) invert(1); }

        .plane-icon {
            font-size: 20px;
            text-shadow: 0 0 6px rgba(88, 166, 255, 0.6);
            transition: transform 0.3s;
        }

        .leaflet-popup-content-wrapper {
            background: var(--card);
            color: var(--text);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .leaflet-popup-tip { background: var(--card); }

        .popup-content { font-size: 0.85rem; line-height: 1.6; }
        .popup-content strong { color: var(--accent); }

        .radius-circle { fill: rgba(88, 166, 255, 0.05); stroke: rgba(88, 166, 255, 0.3); }

        @media (max-width: 900px) {
            .main { grid-template-columns: 1fr; grid-template-rows: 1fr 300px; }
            .sidebar { border-left: none; border-top: 1px solid var(--border); }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>✈️ Flightradar Nearby</h1>
    <div class="stats">
        <span>🛫 <strong id="flight-count">0</strong> Flüge</span>
        <span>📍 Radius: 50 km</span>
        <span>🔄 Aktualisiert: <span id="last-update">–</span></span>
    </div>
</div>

<div class="main">
    <div id="map"></div>
    <div class="sidebar">
        <h2>Flüge im Umkreis</h2>
        <div id="flight-list"></div>
    </div>
</div>

<script>
// Beispiel-Standort (München)
const CENTER = [48.1351, 11.5820];
const RADIUS_KM = 50;

// Beispiel-Flugdaten
const FLIGHTS = [
    { flight_number: "LH1832", airline: "Lufthansa", aircraft_type: "A320neo", origin_iata: "FRA", origin_airport: "Frankfurt", destination_iata: "MUC", destination_airport: "München", departure_time: "14:30", arrival_time: "15:25", altitude: 12000, speed: 380, heading: 165, distance_km: 8.2, latitude: 48.19, longitude: 11.62, registration: "D-AINP" },
    { flight_number: "EW9544", airline: "Eurowings", aircraft_type: "A319", origin_iata: "DUS", origin_airport: "Düsseldorf", destination_iata: "MUC", destination_airport: "München", departure_time: "13:55", arrival_time: "15:10", altitude: 18000, speed: 420, heading: 155, distance_km: 15.7, latitude: 48.25, longitude: 11.45, registration: "D-AGWN" },
    { flight_number: "TK1634", airline: "Turkish Airlines", aircraft_type: "B738", origin_iata: "IST", origin_airport: "Istanbul", destination_iata: "MUC", destination_airport: "München", departure_time: "11:20", arrival_time: "14:45", altitude: 25000, speed: 460, heading: 290, distance_km: 22.4, latitude: 48.05, longitude: 11.82, registration: "TC-JFZ" },
    { flight_number: "OS112", airline: "Austrian", aircraft_type: "E195", origin_iata: "VIE", origin_airport: "Wien", destination_iata: "MUC", destination_airport: "München", departure_time: "14:00", arrival_time: "15:00", altitude: 22000, speed: 400, heading: 270, distance_km: 31.5, latitude: 48.02, longitude: 11.95, registration: "OE-LWD" },
    { flight_number: "LX1104", airline: "Swiss", aircraft_type: "A220", origin_iata: "ZRH", origin_airport: "Zürich", destination_iata: "MUC", destination_airport: "München", departure_time: "14:15", arrival_time: "15:05", altitude: 28000, speed: 440, heading: 45, distance_km: 35.8, latitude: 47.95, longitude: 11.35, registration: "HB-JCR" },
    { flight_number: "FR4412", airline: "Ryanair", aircraft_type: "B738", origin_iata: "STN", origin_airport: "London Stansted", destination_iata: "MUC", destination_airport: "München", departure_time: "12:40", arrival_time: "15:30", altitude: 35000, speed: 480, heading: 120, distance_km: 38.1, latitude: 48.30, longitude: 11.25, registration: "EI-DLR" },
    { flight_number: "UA907", airline: "United Airlines", aircraft_type: "B789", origin_iata: "EWR", origin_airport: "Newark", destination_iata: "MUC", destination_airport: "München", departure_time: "22:30", arrival_time: "14:50", altitude: 32000, speed: 500, heading: 95, distance_km: 42.3, latitude: 48.35, longitude: 11.70, registration: "N29961" },
    { flight_number: "EK53", airline: "Emirates", aircraft_type: "A380", origin_iata: "DXB", origin_airport: "Dubai", destination_iata: "MUC", destination_airport: "München", departure_time: "08:45", arrival_time: "13:20", altitude: 38000, speed: 520, heading: 310, distance_km: 45.0, latitude: 47.90, longitude: 11.50, registration: "A6-EUV" },
];

// Karte initialisieren
const map = L.map('map', { zoomControl: true }).setView(CENTER, 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

// Radius-Kreis
L.circle(CENTER, {
    radius: RADIUS_KM * 1000,
    color: 'rgba(88, 166, 255, 0.4)',
    fillColor: 'rgba(88, 166, 255, 0.05)',
    fillOpacity: 0.3,
    weight: 1,
    dashArray: '5, 5',
}).addTo(map);

// Standort-Marker
L.marker(CENTER, {
    icon: L.divIcon({
        html: '<div style="font-size:24px; text-align:center;">🏠</div>',
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        className: '',
    })
}).addTo(map).bindPopup('<strong>Dein Standort</strong>');

// Flugzeug-Marker
const markers = {};
FLIGHTS.forEach(f => {
    const icon = L.divIcon({
        html: `<div class="plane-icon" style="transform: rotate(${f.heading}deg);">✈️</div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12],
        className: '',
    });

    const marker = L.marker([f.latitude, f.longitude], { icon }).addTo(map);
    marker.bindPopup(`
        <div class="popup-content">
            <strong>${f.flight_number}</strong> – ${f.airline}<br>
            ✈️ ${f.aircraft_type} (${f.registration})<br>
            🛫 ${f.origin_iata} (${f.departure_time}) → 🛬 ${f.destination_iata} (${f.arrival_time})<br>
            📏 ${f.distance_km} km entfernt<br>
            ⬆️ ${f.altitude} ft · ${f.speed} kts
        </div>
    `);
    markers[f.flight_number] = marker;
});

// Sidebar Flug-Liste
const listEl = document.getElementById('flight-list');
document.getElementById('flight-count').textContent = FLIGHTS.length;
document.getElementById('last-update').textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

FLIGHTS.forEach(f => {
    const card = document.createElement('div');
    card.className = 'flight-card';
    card.innerHTML = `
        <div class="flight-header">
            <span class="flight-number">${f.flight_number}</span>
            <span class="flight-distance">${f.distance_km} km</span>
        </div>
        <div class="flight-airline">${f.airline} · ${f.aircraft_type}</div>
        <div class="flight-route">
            <div class="airport">
                <div class="airport-iata">${f.origin_iata}</div>
                <div class="airport-name">${f.origin_airport}</div>
                <div class="airport-time">↑ ${f.departure_time}</div>
            </div>
            <div class="route-arrow">→</div>
            <div class="airport">
                <div class="airport-iata">${f.destination_iata}</div>
                <div class="airport-name">${f.destination_airport}</div>
                <div class="airport-time">↓ ${f.arrival_time}</div>
            </div>
        </div>
        <div class="flight-meta">
            <span>⬆️ ${f.altitude} ft</span>
            <span>💨 ${f.speed} kts</span>
            <span>🧭 ${f.heading}°</span>
            <span>📋 ${f.registration}</span>
        </div>
    `;

    card.addEventListener('click', () => {
        document.querySelectorAll('.flight-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        map.flyTo([f.latitude, f.longitude], 12, { duration: 0.8 });
        markers[f.flight_number].openPopup();
    });

    listEl.appendChild(card);
});
</script>

</body>
</html>
